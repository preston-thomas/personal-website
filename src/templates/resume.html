{% extends "base.html" %}

{% block content %}
<section class="panel reveal">
    <h1>Resume</h1>
    <p class="resume-lead">View the embedded PDF below or open it in a new tab.</p>
    <p><a class="btn btn-primary" href="{{ url_for('static', filename='resume.pdf') }}" target="_blank" rel="noopener noreferrer">Open PDF</a></p>
    <div class="resume-frame-wrap">
        <iframe
            src="{{ url_for('static', filename='resume.pdf') }}"
            title="Preston Thomas Resume"
            class="resume-frame"
        ></iframe>
    </div>
</section>
{% endblock %}
